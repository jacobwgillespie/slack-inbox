name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      VITE_KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release version and credentials
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (process.env.RELEASE_TAG && process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must match package.json: v${version}`)
          }
          for (const name of ['CSC_LINK', 'CSC_KEY_PASSWORD', 'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD', 'APPLE_TEAM_ID']) {
            if (!process.env[name]) throw new Error(`Missing signing secret: ${name}`)
          }
          JS
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:release
      - name: Verify signed and notarized apps
        run: |
          for app in release/mac-arm64/*.app release/mac/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --verbose --type execute "$app"
            xcrun stapler validate "$app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release
      - name: Upload draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            node -e 'if (!require("./release-state.json").isDraft) throw new Error("Cannot overwrite a published release")'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Slack Inbox $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
