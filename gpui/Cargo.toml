[package]
name = "slack-inbox-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dotenvy = "0.15.7"
emojis = "0.9.0"
futures = "0.3.34"
gpui-kit = "0.7"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3", features = ["json"] }
